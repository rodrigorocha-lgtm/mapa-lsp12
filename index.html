<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapa de Clusters | LSP-12</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#0b1220;--panel:#111827;--line:#273449;--text:#f8fafc;--muted:#94a3b8;--accent:#ff6b00;--green:#16a34a}
*{box-sizing:border-box} html,body{height:100%;margin:0;font-family:Inter,system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{height:100%;display:grid;grid-template-columns:330px 1fr}.side{padding:18px;background:linear-gradient(180deg,#111827,#0b1220);border-right:1px solid var(--line);overflow:auto}
.brand{font-size:20px;font-weight:800}.sub{color:var(--muted);font-size:12px;margin:5px 0 18px}.card{background:#111827;border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:12px}
label{font-size:12px;color:#cbd5e1;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap}.btn,.filebtn{border:1px solid #334155;background:#172033;color:#fff;padding:9px 11px;border-radius:9px;font-weight:700;cursor:pointer;font-size:12px}
.btn:hover,.filebtn:hover{background:#202d43}.primary{background:var(--accent);border-color:var(--accent)}.danger{background:#2a1620}
input[type=file]{display:none}.search{width:100%;margin-top:8px;padding:10px 11px;border-radius:9px;border:1px solid #334155;background:#0b1220;color:#fff}
.stats{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin:10px 0}
.list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:43vh;overflow:auto}.chip{padding:8px 5px;border:1px solid #334155;border-radius:8px;text-align:center;cursor:pointer;font-size:12px;background:#0f172a}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}.chip.data{box-shadow:inset 0 0 0 1px #22c55e}
#map{height:100%;width:100%}.status{font-size:11px;color:var(--muted);line-height:1.45}.legend{position:absolute;z-index:999;right:12px;bottom:20px;background:#111827e8;border:1px solid #334155;padding:10px;border-radius:10px;font-size:12px}
.dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px}.orange{background:#ff6b00}.gray{background:#64748b}.green{background:#16a34a}
@media(max-width:760px){.app{grid-template-columns:1fr}.side{position:absolute;z-index:1001;width:min(88vw,350px);height:100%;left:0;top:0;transform:translateX(-100%);transition:.2s}.side.open{transform:none}.mobile{display:block!important}.legend{bottom:10px}}
.mobile{display:none;position:absolute;z-index:1002;top:10px;left:10px;border:0;border-radius:10px;padding:10px 13px;background:#111827;color:#fff;font-weight:800}
</style>
</head>
<body>
<button class="mobile" onclick="document.querySelector('.side').classList.toggle('open')">☰ Clusters</button>
<div class="app">
<aside class="side">
  <div class="brand">Mapa de Clusters • LSP-12</div>
  <div class="sub">Jardim Adriana • descubra a região da sua rota</div>

<div class="card">
    <label>ENCONTRE SUA REGIÃO</label>
    <input id="filter" class="search" placeholder="Buscar cluster ou bairro, ex.: C-14, Adriana">
    <div class="stats"><span id="count">0 selecionados</span><span id="total">0 clusters</span></div>
    <div class="row" style="margin-bottom:9px">
      <button class="btn" id="all">Selecionar tudo</button>
      <button class="btn danger" id="clear">Limpar</button>
    </div>
    <div id="list" class="list"></div><div id="bairroInfo" class="card" style="margin-top:12px"><b>Selecione uma cluster</b><p class="status">Veja os bairros de referência para reconhecer a região da rota.</p></div>
  </div>
</aside>
<main style="position:relative">
  <div id="map"></div>
  <div class="legend"><div><span class="dot orange"></span>Selecionada</div><div><span class="dot gray"></span>Demais áreas</div></div>
</main>
</div>

const REMOTE_GEOJSON="https://expressspx.github.io/Map/mapa.geojson";
const map=L.map('map',{zoomControl:true}).setView([-23.43,-46.50],11);
const street=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap'});
const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20,attribution:'Esri'}).addTo(map);
L.control.layers({"Mapa":street,"Satélite":satellite},null,{position:'topright'}).addTo(map);

let geoLayer=null, features=[], selected=new Set();
const $=id=>document.getElementById(id);
function norm(v){return String(v??'').trim().toUpperCase().replace(/\s+/g,'')}
function clusterName(props){
  const keys=Object.keys(props||{});
  for(const k of keys){ if(/cluster|name|nome|area|regiao|região/i.test(k)){let v=String(props[k]??'').trim(); if(/^[A-Z]{1,3}[-\s]?\d+/i.test(v)) return v.replace(/\s+/g,'').toUpperCase();}}
  for(const v of Object.values(props||{})){let s=String(v??'').trim(); if(/^[A-Z]{1,3}[-\s]?\d+$/i.test(s)) return s.replace(/\s+/g,'').toUpperCase();}
  return null;
}
function styleFor(name){
  if(selected.has(name)) return {color:'#7c2d12',weight:2.2,fillColor:'#ff6b00',fillOpacity:.62};
  return {color:'#1f2937',weight:1.4,fillColor:'#64748b',fillOpacity:.28};
}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normText(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().trim();}
function uniqueBairros(info){
 const names=[]; const seen=new Set();
 for(const b of info.bairros){
  const key=normText(b.nome).replace(/\b(JD|JARDIM)\b/g,'JARDIM').replace(/\b(PQ|PARQUE)\b/g,'PARQUE').replace(/[^A-Z0-9]/g,'');
  if(!seen.has(key)){seen.add(key);names.push(b.nome);}
 }
 return names;
}
function showBairro(n){
 const info=BAIRROS[n], box=$('bairroInfo');
 if(!info){box.innerHTML='<b>Cluster '+safe(n)+'</b><p class="status">Bairro de referência ainda não identificado.</p>';return;}
 const names=uniqueBairros(info);
 const primaryParts=normText(info.principal).split('/').map(x=>x.trim());
 let others=names.filter(x=>!primaryParts.includes(normText(x)));
 if((n==='C-22'||n==='C-23')&&!others.some(x=>normText(x)==='CENTRO')) others.unshift('Centro');
 // Priorizar nomes úteis e conservar Centro entre as referências de C-22 e C-23.
 let visibleOthers=others.slice(0,8);
 if((n==='C-22'||n==='C-23')&&!visibleOthers.some(x=>normText(x)==='CENTRO')) visibleOthers=[...visibleOthers.slice(0,7),'Centro'];
 box.innerHTML='<div class="status" style="letter-spacing:.07em;font-weight:800">INFORMAÇÕES DA CLUSTER</div>'+
 '<h3 style="margin:6px 0 14px;font-size:20px">Cluster '+safe(n)+'</h3>'+
 '<div style="font-size:12px;color:#cbd5e1;font-weight:800;margin-bottom:5px">📍 BAIRRO PRINCIPAL / REGIÃO DE REFERÊNCIA</div>'+
 '<div style="font-size:19px;font-weight:800;color:#fb923c;line-height:1.35;margin-bottom:15px">'+safe(info.principal)+'</div>'+
 '<div style="border-top:1px solid #334155;padding-top:12px"><div style="font-size:12px;color:#cbd5e1;font-weight:800;margin-bottom:8px">🏘️ BAIRROS QUE TAMBÉM APARECEM NESTA CLUSTER</div>'+
 (visibleOthers.length?'<div style="display:flex;flex-wrap:wrap;gap:6px">'+visibleOthers.map(x=>'<span style="font-size:12px;background:#1e293b;border:1px solid #334155;border-radius:7px;padding:6px 8px">'+safe(x)+'</span>').join('')+'</div>':'<p class="status">Nenhum outro bairro identificado na amostra.</p>')+'</div>'+
 '<p class="status" style="margin-top:13px">Bairros de referência aproximados para orientação.</p>';
}

function redraw(){
  if(geoLayer) geoLayer.eachLayer(l=>{let n=l._clusterName;if(n)l.setStyle(styleFor(n))});
  renderList();
  $('count').textContent=`${selected.size} selecionados`;
}
function renderList(){
  const q=norm($('filter').value); $('list').innerHTML='';
  const names=[...new Set(features.map(f=>f._clusterName).filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  $('total').textContent=`${names.length} clusters`;
  names.filter(n=>!q||n.includes(q)||normText([BAIRROS[n]?.principal,...(BAIRROS[n]?.bairros||[]).map(b=>b.nome)].join(' ')).includes(normText($('filter').value))).forEach(n=>{
    const d=document.createElement('div'); d.className='chip'+(selected.has(n)?' on':'');
    d.textContent=n; d.title=BAIRROS[n]?.principal||'Bairro não identificado';
    d.onclick=()=>{selected.has(n)?selected.delete(n):selected.add(n);showBairro(n);redraw();};
    $('list').appendChild(d);
  });
}
function loadGeoJSON(gj,source='GeoJSON'){
  if(geoLayer) map.removeLayer(geoLayer);
  features=(gj.features||[]).map(f=>{f._clusterName=clusterName(f.properties);return f});
  geoLayer=L.geoJSON(gj,{
    style:f=>styleFor(f._clusterName),
    onEachFeature:(f,l)=>{
      l._clusterName=f._clusterName;
      if(f._clusterName){
        l.bindTooltip(f._clusterName,{permanent:true,direction:'center',className:'cluster-label'});
        l.bindPopup(()=>{const a=BAIRROS[f._clusterName];return '<b>Cluster '+safe(f._clusterName)+'</b><br>Região de referência: <b>'+(a?safe(a.principal):'Não identificada')+'</b><br><small>Orientação aproximada</small>'});
        l.on('click',()=>{selected.has(f._clusterName)?selected.delete(f._clusterName):selected.add(f._clusterName);showBairro(f._clusterName);redraw()});
      }
    }
  }).addTo(map);
  try{map.fitBounds(geoLayer.getBounds(),{padding:[15,15]})}catch(e){}
  renderList(); redraw();
}
async function remoteLoad(){
  try{
    const r=await fetch(REMOTE_GEOJSON,{cache:'no-store'}); if(!r.ok)throw new Error('HTTP '+r.status);
    loadGeoJSON(await r.json(),'Mapa de referência');
  }catch(e){
    features=Object.keys(BAIRROS).map(n=>({_clusterName:n}));renderList();
    $('bairroInfo').innerHTML='<b>Mapa temporariamente indisponível</b><p class="status">Você ainda pode consultar as regiões pela lista de clusters.</p>';
  }
}
$('filter').oninput=renderList;
$('clear').onclick=()=>{selected.clear();redraw()};
$('all').onclick=()=>{features.forEach(f=>{if(f._clusterName)selected.add(f._clusterName)});redraw()};

features=Object.keys(BAIRROS).map(n=>({_clusterName:n}));renderList();remoteLoad();
</script>
